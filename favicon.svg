<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="#1A56C4">
  <!-- The esp32install signet: a lead going into a device with a screen.
       Same drawing as the header sign in index.html; keep the two in step.
       A tab strip has no theme to read, so here the whole sign is the accent,
       the screen is a hole and the state dot is cut in white: legible on a white
       strip and on a dark one, with no media query to be ignored. -->
