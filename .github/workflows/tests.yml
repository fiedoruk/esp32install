# The rule in CONTRIBUTING form: every change needs both suites green. Nothing else runs here —
# there is no build step to run, no bundle to produce and no dependency to install.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    name: node --test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test

  python:
    name: python -m unittest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m unittest discover -s tools/tests -t .
      - name: check.py on the tree
        run: python3 tools/check.py .
